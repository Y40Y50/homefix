{% extends 'maintenance/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Properties</h1>

    <a href="{% url 'create_property' %}" class="btn btn-primary">
        Create Property
    </a>
</div>


<div class="row">

    {% for property in properties %}

    <div class="col-md-4 mb-3">

        <div class="card">

            <div class="card-body">

                <h5 class="card-title">
                    {{ property.name }}
                </h5>

                <p class="card-text">
                    {{ property.address }}
                </p>
                <a href="/properties/edit/{{ property.id }}/" class="btn btn-warning btn-sm mt-2">
                    Edit
                </a>
                <a href="/properties/delete/{{ property.id }}/" class="btn btn-danger btn-sm mt-2">
                    Delete
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
