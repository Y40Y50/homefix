{% extends 'maintenance/base.html' %}

{% block content %}

<h1 class="display-4 fw-bold mb-4">
    Properties
</h1>

<div class="row">

    {% for property in properties %}

    <div class="col-md-4 mb-3">

        <div class="card">

            <div class="card-body">

                <h5 class="card-title">
                    {{ property.name }}
                </h5>

                <p class="card-text">
                    {{ property.address }}
                </p>
                <a href="/properties/edit/{{ property.id }}/" class="btn btn-warning btn-sm mt-2">
                    Edit
                </a>
                <a href="/properties/delete/{{ property.id }}/" class="btn btn-danger btn-sm mt-2">
                    Delete
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
