{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3" style="background-color: #242d43;">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{% static 'images/logo.png' %}" height="60" class="me-2">

                <span class="fs-3 fw-bold">
                    HomeFix
                </span>
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="/">
                    Home
                </a>

                <a class="nav-link" href="/properties/">
                    Properties
                </a>

                <a class="nav-link" href="/contractors/">
                    Contractors
                </a>
                <a class="nav-link" href="/jobs/">
                    Jobs
                </a>
                <a class="nav-link" href="/jobs/create/">
                    Create Job
                </a>
                {% if user.is_authenticated %}

                <form action="/accounts/logout/" method="POST" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link p-0 border-0">
                        Logout
                    </button>
                </form>

                {% else %}

                <a class="nav-link" href="/accounts/login/">
                    Login
                </a>

                <a class="nav-link" href="/accounts/register/">
                    Register
                </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
